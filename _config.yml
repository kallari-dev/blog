title: Recall
tagline: Notes from the shadow realm
description: "Offensive security writeups and guides, plus overviews of projects: engagements, coding and research."
url: https://kallari.dev
baseurl: ""
lang: en_US

author:
  name: Kallari

# Linked from the portfolio card, the About page and the footer
github_url: https://github.com/kallari-dev

# GitHub Pages only runs whitelisted plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

permalink: pretty

collections:
  articles:
    output: true
    permalink: /blog/:name/
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: articles
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - docs
  - vendor
  - .obsidian
